; HueAlarm - Hue alarm clock on M5Stack Core2 v1.1 (CoreS3 builds, but its Wi-Fi was too weak)
; Build:  python -m platformio run -e core2
; Flash:  python -m platformio run -e core2 -t upload
; Logs:   python -m platformio device monitor -e core2
; Sleep / wake-up mode and battery life: include/config.h, docs/POWER.md
; Hardware check firmware: env "hwcheck" (CoreS3); power test: env "powertest" (Core2)

[platformio]
default_envs = core2

[env]
platform = espressif32 @ 7.1.3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    m5stack/M5Unified @ 0.2.25
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<app/>

[cores3_flags]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:cores3]
board = m5stack-cores3
build_flags = ${cores3_flags.build_flags}

[env:core2]
board = m5stack-core2

[env:hwcheck]
board = m5stack-cores3
build_flags = ${cores3_flags.build_flags}
build_src_filter = +<hwcheck/>

; Battery / sleep current test for the Core2 v1.1 (see src/powertest/main.cpp)
[env:powertest]
board = m5stack-core2
build_src_filter = +<powertest/>
